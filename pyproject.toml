[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "digest-pipeline"
version = "0.1.0"
description = "Automated news aggregation and podcast generation pipeline"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy", "kokoro", "flask>=3.0"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
digest-pipeline = "digest_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["digest_pipeline"]
